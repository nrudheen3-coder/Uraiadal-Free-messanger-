<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Uraiadal Call Debug v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0A0A0F;color:#F0F0FF;font-family:monospace;padding:12px;font-size:12px;}
h1{color:#6C63FF;margin-bottom:12px;font-size:16px;}
input{width:100%;background:#141420;border:1px solid #2A2A3E;border-radius:8px;padding:9px;color:#F0F0FF;font-size:12px;margin-bottom:6px;outline:none;}
button{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;margin:3px;}
.bp{background:#6C63FF;color:#fff;}
.bg{background:#00D9A5;color:#000;}
.br{background:#FF4F6B;color:#fff;}
.by{background:#FFB347;color:#000;}
.bw{background:#1E1E2E;color:#7B7B9A;}
#log{background:#050510;border:1px solid #1A1A2E;border-radius:8px;padding:10px;height:380px;overflow-y:auto;margin:10px 0;line-height:1.8;}
.ok{color:#00D9A5;}.er{color:#FF4F6B;}.wa{color:#FFB347;}.in{color:#6C63FF;}.gr{color:#555;}
video{width:49%;background:#141420;border-radius:6px;border:1px solid #2A2A3E;}
.vids{display:flex;gap:4px;margin-top:8px;}
</style>
</head>
<body>
<h1>🔐 Call Debugger v3</h1>

<input id="relay" value="https://uraiadal-relay.nrudheen3.workers.dev">
<input id="myId" placeholder="Your ID: urai_xxxxxxxxxx">
<input id="theirId" placeholder="Their ID: urai_xxxxxxxxxx">

<div>
<button class="bp" onclick="testRelay()">🔍 Test</button>
<button class="bg" onclick="doCall('audio')">📞 Call</button>
<button class="bg" onclick="doCall('video')">📹 Video</button>
<button class="by" onclick="poll()">📡 Poll</button>
<button class="br" onclick="doHangup()">📵 End</button>
<button class="bw" onclick="log2('','gr');$('log').innerHTML=''">🗑</button>
</div>

<div id="log"><div class="gr">[ready] Enter IDs and tap Test</div></div>

<div class="vids">
  <video id="lv" autoplay playsinline muted></video>
  <video id="rv" autoplay playsinline></video>
</div>

<script>
const $=id=>document.getElementById(id);
let pc=null,ls=null,polling=null,myId=null,theirId=null,offerSent=false;

function t(){return new Date().toTimeString().slice(0,8);}
function log2(msg,cls='in'){
  const d=$('log');
  d.innerHTML+=`<div class="${cls}">[${t()}] ${msg}</div>`;
  d.scrollTop=d.scrollHeight;
}

const ICE={iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'stun:stun2.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
]};

async function testRelay(){
  log2('Testing relay...','in');
  try{
    const r=await fetch($('relay').value+'/health');
    const d=await r.json();
    log2(`✅ Relay OK — v${d.version}`,'ok');
    // Test signal endpoint
    const r2=await fetch($('relay').value+'/signal?id=urai_test123');
    const d2=await r2.json();
    log2(`✅ Signal endpoint OK — ${JSON.stringify(d2)}`,'ok');
  }catch(e){log2('❌ Relay error: '+e.message,'er');}
}

async function sendSig(toId,signal){
  const from=$('myId').value.trim();
  log2(`📤 Sending signal: ${signal.type} → ${toId.slice(0,16)}`,'in');
  try{
    const r=await fetch($('relay').value+'/signal',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fromId:from,toId,signal})
    });
    const d=await r.json();
    if(d.success) log2(`✅ Signal sent: ${signal.type}`,'ok');
    else log2(`❌ Signal FAILED: ${JSON.stringify(d)}`,'er');
    return d.success;
  }catch(e){log2('❌ Send error: '+e.message,'er');return false;}
}

async function poll(){
  myId=$('myId').value.trim();
  if(!myId){log2('⚠️ Enter your ID','wa');return;}
  try{
    const r=await fetch($('relay').value+'/signal?id='+myId);
    const d=await r.json();
    if(d.signals&&d.signals.length>0){
      log2(`📥 Got ${d.signals.length} signal(s)`,'ok');
      for(const item of d.signals){
        log2(`  → type:${item.signal.type} from:${item.fromId.slice(0,16)}`,'ok');
        await handleSig(item.fromId,item.signal);
      }
    }
  }catch(e){log2('Poll error: '+e.message,'er');}
}

async function handleSig(fromId,sig){
  log2(`🔔 Handle: ${sig.type} from ${fromId.slice(0,16)}`,'wa');
  
  if(sig.type==='offer'){
    theirId=fromId;$('theirId').value=fromId;
    log2(`📞 Incoming ${sig.callType||'audio'} call!`,'wa');
    if(confirm(`Incoming call from ${fromId.slice(0,16)}\nAnswer?`)){
      await doAnswer(fromId,sig);
    }else{
      await sendSig(fromId,{type:'reject'});
    }
    return;
  }
  
  if(sig.type==='answer'&&pc){
    log2('📋 Got answer — setting remote desc','in');
    try{
      await pc.setRemoteDescription(new RTCSessionDescription({type:'answer',sdp:sig.sdp}));
      log2('✅ Remote desc set (answer)','ok');
    }catch(e){log2('❌ setRemoteDesc answer: '+e.message,'er');}
    return;
  }
  
  if(sig.type==='ice'&&pc){
    const cs=sig.candidates||(sig.candidate?[sig.candidate]:[]);
    log2(`🧊 Adding ${cs.length} ICE candidates`,'in');
    for(const c of cs){
      try{
        await pc.addIceCandidate(new RTCIceCandidate(c));
        log2(`  ✅ ICE added: ${c.candidate?c.candidate.split(' ')[7]||'?':'?'}`,'ok');
      }catch(e){log2('  ❌ ICE fail: '+e.message,'er');}
    }
    return;
  }
  
  if(sig.type==='hangup'){log2('📵 Remote hung up','wa');doHangup();return;}
  if(sig.type==='reject'){log2('❌ Call rejected','er');doHangup();return;}
}

function makePC(){
  if(pc){pc.close();pc=null;}
  log2('🔧 Creating RTCPeerConnection','gr');
  pc=new RTCPeerConnection(ICE);
  const rs=new MediaStream();
  $('rv').srcObject=rs;
  
  pc.ontrack=e=>{
    log2(`🎵 Remote track: ${e.track.kind}`,'ok');
    e.streams[0]?.getTracks().forEach(t=>rs.addTrack(t));
  };
  
  pc.onicecandidate=e=>{
    if(!e.candidate){log2('🧊 ICE gathering complete','ok');return;}
    log2(`🧊 ICE: ${e.candidate.type} / ${e.candidate.protocol}`,'gr');
  };
  
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    const c={connected:'ok',failed:'er',disconnected:'wa',connecting:'in',new:'gr',closed:'er'}[s]||'in';
    log2(`🔗 Connection: ${s}`,c);
  };
  
  pc.oniceconnectionstatechange=()=>{
    const s=pc.iceConnectionState;
    const c={connected:'ok',completed:'ok',failed:'er',disconnected:'wa',checking:'in',new:'gr'}[s]||'in';
    log2(`🧊 ICE state: ${s}`,c);
  };
  
  pc.onsignalingstatechange=()=>{
    log2(`📡 Signaling: ${pc.signalingState}`,'gr');
  };

  pc.onicegatheringstatechange=()=>{
    log2(`🧊 Gathering: ${pc.iceGatheringState}`,'gr');
  };
  
  return pc;
}

async function getMedia(type){
  log2(`🎤 Requesting ${type} media...`,'in');
  try{
    ls=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true},
      video:type==='video'?{facingMode:'user',width:{ideal:640}}:false
    });
    $('lv').srcObject=ls;
    log2(`✅ Got media: ${ls.getTracks().map(t=>t.kind).join(',')}`,'ok');
    return ls;
  }catch(e){
    log2(`❌ Media FAILED: ${e.name}: ${e.message}`,'er');
    throw e;
  }
}

async function waitICE(){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete'){res();return;}
    log2('⏳ Waiting for ICE gathering...','gr');
    const t=setTimeout(()=>{log2('⏰ ICE timeout (2s) — proceeding','wa');res();},2000);
    pc.onicegatheringstatechange=()=>{
      if(pc.iceGatheringState==='complete'){
        log2('✅ ICE gathering complete','ok');
        clearTimeout(t);res();
      }
    };
  });
}

async function doCall(type){
  myId=$('myId').value.trim();
  theirId=$('theirId').value.trim();
  if(!myId||!theirId){log2('⚠️ Enter both IDs','wa');return;}
  if(pc){log2('⚠️ Already in a call','wa');return;}
  
  log2(`📞 Calling ${theirId.slice(0,16)} (${type})...`,'in');
  try{
    await getMedia(type);
    makePC();
    ls.getTracks().forEach(t=>pc.addTrack(t,ls));
    
    log2('📋 Creating offer...','in');
    const offer=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:type==='video'});
    await pc.setLocalDescription(offer);
    log2('✅ Local desc set (offer)','ok');
    
    await waitICE();
    
    // Send final SDP (includes ICE candidates)
    const finalSDP=pc.localDescription.sdp;
    log2(`📤 Sending offer (SDP length: ${finalSDP.length})...`,'in');
    const ok=await sendSig(theirId,{type:'offer',sdp:finalSDP,callType:type});
    
    if(ok){
      log2('✅ Offer sent! Starting poll for answer...','ok');
      startPoll();
    }
  }catch(e){log2('❌ Call error: '+e.message,'er');doHangup();}
}

async function doAnswer(fromId,sig){
  const type=sig.callType||'audio';
  log2(`📲 Answering ${type} call from ${fromId.slice(0,16)}`,'in');
  try{
    await getMedia(type);
    makePC();
    ls.getTracks().forEach(t=>pc.addTrack(t,ls));
    
    log2('📋 Setting remote desc (offer)...','in');
    await pc.setRemoteDescription(new RTCSessionDescription({type:'offer',sdp:sig.sdp}));
    log2('✅ Remote desc set (offer)','ok');
    
    log2('📋 Creating answer...','in');
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    log2('✅ Local desc set (answer)','ok');
    
    await waitICE();
    
    const finalSDP=pc.localDescription.sdp;
    log2(`📤 Sending answer (SDP: ${finalSDP.length})...`,'in');
    await sendSig(fromId,{type:'answer',sdp:finalSDP});
    log2('✅ Answer sent! Waiting for connection...','ok');
    
    startPoll();
  }catch(e){log2('❌ Answer error: '+e.message,'er');doHangup();}
}

function startPoll(){
  if(polling)return;
  log2('📡 Auto-polling every 1s','gr');
  polling=setInterval(poll,1000);
}

function doHangup(){
  clearInterval(polling);polling=null;
  if(theirId&&myId) sendSig(theirId,{type:'hangup'}).catch(()=>{});
  ls?.getTracks().forEach(t=>t.stop());
  pc?.close();pc=null;ls=null;
  $('lv').srcObject=null;$('rv').srcObject=null;
  log2('📵 Ended','wa');
}

// Auto-listen for incoming calls
let listenTimer=null;
$('myId').addEventListener('change',()=>{
  clearInterval(listenTimer);
  const id=$('myId').value.trim();
  if(id.startsWith('urai_')){
    log2('👂 Listening for calls...','gr');
    listenTimer=setInterval(poll,2000);
  }
});
</script>
</body>
</html>
